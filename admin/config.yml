backend:
  name: github
  repo: shaanaks99/elite-auto-gallery
  branch: main
  # Disable the OAuth proxy - use direct GitHub authentication instead
  base_url: ""

media_folder: "images/cars"
public_folder: "/images/cars"

publish_mode: editorial_workflow

collections:
  - name: "cars"
    label: "🚗 Car Inventory"
    label_singular: "Car"
    folder: "_cars"
    create: true
    delete: true
    slug: "{{year}}-{{make}}-{{model}}"
    
    summary: "{{year}} {{make}} {{model}} - {{availability}} (£{{price}})"
    
    sortable_fields: ['year', 'make', 'price', 'availability']
    
    editor:
      preview: true
    
    fields:
      - label: "Make"
        name: "make"
        widget: "string"
        required: true
        
      - label: "Model"
        name: "model"
        widget: "string"
        required: true
        
      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 1990
        max: 2030
        required: true
        default: 2024
        
      - label: "Trim"
        name: "trim"
        widget: "string"
        required: false
      
      - label: "💷 Price (£)"
        name: "price"
        widget: "number"
        value_type: "int"
        required: true
        
      - label: "Availability"
        name: "availability"
        widget: "select"
        required: true
        default: "available"
        options:
          - label: "✅ Available"
            value: "available"
          - label: "⏳ Reserved"
            value: "reserved"
          - label: "❌ Sold"
            value: "sold"
        
      - label: "⭐ Featured"
        name: "featured"
        widget: "boolean"
        required: false
        default: false
      
      - label: "Mileage"
        name: "mileage"
        widget: "number"
        value_type: "int"
        required: true
        
      - label: "Transmission"
        name: "transmission"
        widget: "select"
        required: true
        options:
          - "Automatic"
          - "Manual"
          - "Semi-Automatic"
        default: "Automatic"
        
      - label: "Fuel Type"
        name: "fuelType"
        widget: "select"
        required: true
        options:
          - "Petrol"
          - "Diesel"
          - "Electric"
          - "Hybrid"
          - "Plug-in Hybrid"
        default: "Petrol"
        
      - label: "Engine Size"
        name: "engineSize"
        widget: "string"
        required: false
        
      - label: "Power (BHP)"
        name: "power"
        widget: "number"
        required: false
        
      - label: "Body Type"
        name: "bodyType"
        widget: "select"
        required: false
        options:
          - "Sedan"
          - "Coupe"
          - "SUV"
          - "Convertible"
          - "Hatchback"
          - "Estate"
          - "Sports Car"
          - "Supercar"
        
      - label: "Doors"
        name: "doors"
        widget: "number"
        value_type: "int"
        default: 4
        min: 2
        max: 5
        
      - label: "Seats"
        name: "seats"
        widget: "number"
        value_type: "int"
        default: 5
        min: 2
        max: 8
      
      - label: "Exterior Color"
        name: "color"
        widget: "string"
        required: true
        
      - label: "Interior Color"
        name: "interiorColor"
        widget: "string"
        required: false
      
      - label: "Registration"
        name: "registration"
        widget: "string"
        required: false
        
      - label: "VIN"
        name: "vin"
        widget: "string"
        required: false
      
      - label: "📸 Car Images"
        name: "images"
        widget: "list"
        required: false
        summary: "Image {{index}}"
        field:
          label: "Image"
          name: "image"
          widget: "image"
          required: false
      
      - label: "✨ Features"
        name: "features"
        widget: "list"
        required: false
        field:
          label: "Feature"
          name: "feature"
          widget: "string"
      
      - label: "📝 Description"
        name: "body"
        widget: "markdown"
        required: false
